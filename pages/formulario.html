<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/periodico.png">
    <title>DIARIO DE NOTICIAS</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;"><strong>SU DIARIO DE NOTICIAS</strong></STRong></h1>
        <summary></summary>
        <div style="display: flex; justify-content: center;"><img src="imgs/images222.png" alt="Lodo del periodico" height="200"></div>
    </header>
    <hr>
    <nav>
        <a href="#noticia1">Noticia 1</a>
        <a href="#noticia2">Noticia 2</a>
        <a href="pages/formulario.html">Registrate para nueva nocia</a>
    </nav>
    <hr>
    <main>
        <form action="REGISTRO">
            <br><br>
            <label for="Nombre">Escriba su nombre</label>
            <br><br>
            <input 
            type="text"
            name="nombre"
            id="nombre"
            placeholder="Escriba su nombre"
            required>  
            <br><br>
            <label for="Correo">Escriba su correo electrónico</label>
            <br><br>
            <input 
            type="email"
            name="correo"
            id="correo"
            placeholder="Escriba su correo"
            required>  
            <br><br>
            <label for="Edad">Escriba su edad</label>
            <br><br>
            <input 
            type="number"
            name="edad"
            id="edad"
            placeholder="Escriba su edad"
            required>  
            <br><br>
            <label for="Preferencia">Seleciones sus preferencia</label>
            <br><br>
            <label for="Preferencia"><input type="checkbox">Deportes</label>
            <label for="Preferencia"><input type="checkbox">Politica</label>
            <label for="Preferencia"><input type="checkbox">Cultural</label>
            <label for="Preferencia"><input type="checkbox">Cronica roja</label>
            <br><br>
            <label for="Ciudad">Seleciones su ciudad de residencia</label>
            <br><br>
            <label for="Ciudad"><input type="radio">QUITO</label>
            <label for="Ciudad"><input type="radio">GUAYAQUIL</label>
            <label for="Ciudad"><input type="radio">CUENCA</label>
            <label for="Ciudad"><input type="radio">OTRA</label>
        </form>
    </main>
    <footer>
        <P>&copy;Minchala Franklin</P>
        <address>QUITO ECUADOR 2026</address>
        
    </footer>
</body>
</html>
